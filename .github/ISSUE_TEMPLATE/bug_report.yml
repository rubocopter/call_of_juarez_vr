name: Bug report
description: Report a bug with steps to reproduce it.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For a reproducible failure. Use the compatibility form for setup, image-quality or performance observations, or the suggestion form for ideas. This pre-alpha is not fully campaign-tested; back up saves.

        Logs are optional. CoJ-VR.cmd > 3 — Diagnostics creates a local report. Inspect it and remove private information before attaching it manually. There is no automatic upload or remote telemetry. Do not share unreviewed saves or memory dumps.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Full downloaded version, or commit and local changes for a source build. Development fixes may not be in the published ZIP.
      placeholder: v0.1.0-prealpha.2
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Headset, controllers/binding, GPU and Windows. Add driver and SteamVR versions if known; for installation failures, any available details are enough.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Name the chapter, character and checkpoint (or startup/menu/installation). Mention manual reload, theater/immersive movies and the saved/applied resolution profile and per-eye dimensions when relevant.
      placeholder: |
        1. Start at...
        2. Perform...
        Expected:
        Actual:
        Repeats:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Reviewed diagnostics / logs
      description: Optional. Attach an inspected local report, relevant error text or a reviewed screenshot/clip. Remove personal information; no explanation is needed if you have no logs.
    validations:
      required: false
