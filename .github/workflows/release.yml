name: Draft Windows prerelease

on:
  workflow_dispatch:
    inputs:
      Version:
        description: 'Semantic prerelease version (for example 0.1.0-prealpha.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-prerelease-${{ github.event.inputs.Version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.Version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and test Release, bootstrap pinned dependencies, package OpenVR
        run: |
          .\tools\package_release.ps1 -Version $env:RELEASE_VERSION -BuildDirectory build/release-openvr

      - name: Verify extracted offline package with Windows PowerShell 5.1
        run: |
          $zip = Get-Item -LiteralPath "dist/CoJ-VR-$env:RELEASE_VERSION-windows-x64.zip"
          .\tests\release_package.ps1 -ZipPath $zip.FullName

      - name: Package developer symbols separately
        run: |
          $pdb = Get-Item -LiteralPath 'build/release-openvr/Release/d3d9_native_stereo.pdb'
          Compress-Archive -LiteralPath $pdb.FullName -DestinationPath "dist/CoJ-VR-$env:RELEASE_VERSION-developer-symbols.zip"
          $symbols = Get-Item -LiteralPath "dist/CoJ-VR-$env:RELEASE_VERSION-developer-symbols.zip"
          $hash = (Get-FileHash -LiteralPath $symbols.FullName -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("$($symbols.FullName).sha256", "$hash  $($symbols.Name)`n", [Text.Encoding]::ASCII)

      - name: Upload player ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoJ-VR-${{ github.event.inputs.Version }}-player
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload developer symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoJ-VR-${{ github.event.inputs.Version }}-developer-symbols
          path: |
            dist/*-developer-symbols.zip
            dist/*-developer-symbols.zip.sha256
          if-no-files-found: error
          compression-level: 0

      # gh release create --draft --prerelease creates an unpublished release.
      # No publish/edit step and no automatic release on push/tag.
      - name: Create draft prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release create "v$env:RELEASE_VERSION" @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Call of Juarez VR $env:RELEASE_VERSION" --notes-file release/RELEASE_NOTES.md --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Draft prerelease creation failed.' }
